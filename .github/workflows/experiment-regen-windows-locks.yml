name: Experiment regenerate Windows locks and build
# Throwaway: regenerates packages.lock.windows.json after the central pin change, then runs the real Windows build and reports
# the bundled async assembly versions and OmniSharp.exe.config redirects. Not for merging.

on:
  push:
    branches:
      - experiment/vs18-async-assemblies
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  regen_and_build:
    runs-on: github-windows-latest-s
    name: Regenerate Windows locks + build net472
    timeout-minutes: 60
    steps:
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2025.7.12

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: "false"
          fetch-depth: "0"

      - name: Get Repox Credentials from Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Regenerate packages.lock.windows.json
        env:
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          dotnet restore OmniSharp.sln --force-evaluate -p:RestoreLockedMode=false
          git status --short
          git diff --stat -- "*packages.lock.windows.json"
          git diff -- "*packages.lock.windows.json" > windows-locks.patch

      - name: Upload regenerated lock files and patch
        uses: actions/upload-artifact@v4
        with:
          name: windows-locks
          path: |
            windows-locks.patch
            **/packages.lock.windows.json
          if-no-files-found: error

      - name: Build and package (locked mode, as in CI)
        env:
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          powershell -File build.ps1 -target Quick -configuration Release

      - name: Report bundled async assemblies and redirects
        shell: powershell
        run: |
          $cfgs = Get-ChildItem artifacts -Recurse -Filter OmniSharp.exe.config | Where-Object { $_.FullName -match 'net472|win' }
          foreach ($c in $cfgs) {
            Write-Host "=== $($c.FullName)"
            $dir = $c.DirectoryName
            foreach ($n in 'Microsoft.Bcl.AsyncInterfaces', 'System.Threading.Tasks.Extensions', 'System.Memory', 'System.Buffers', 'System.Runtime.CompilerServices.Unsafe', 'System.Numerics.Vectors') {
              $f = Join-Path $dir "$n.dll"
              if (Test-Path $f) { Write-Host ("{0,-42} asm={1}" -f $n, [System.Reflection.AssemblyName]::GetAssemblyName($f).Version) }
            }
            [xml]$x = Get-Content -Raw $c.FullName
            $ns = New-Object System.Xml.XmlNamespaceManager($x.NameTable); $ns.AddNamespace('asm', 'urn:schemas-microsoft-com:asm.v1')
            foreach ($d in $x.SelectNodes('//asm:dependentAssembly', $ns)) {
              $n = $d.SelectSingleNode('asm:assemblyIdentity', $ns).GetAttribute('name')
              if ($n -match 'AsyncInterfaces|Tasks.Extensions|System.Memory|System.Buffers|CompilerServices.Unsafe|Numerics.Vectors') {
                Write-Host ("redirect {0,-40} -> {1}" -f $n, $d.SelectSingleNode('asm:bindingRedirect', $ns).GetAttribute('newVersion'))
              }
            }
          }

      - name: Upload net472 output (config + async DLLs) and packages
        uses: actions/upload-artifact@v4
        with:
          name: net472-output
          path: |
            artifacts/package/**/omnisharp-*.zip
            artifacts/publish/**/net472/**/OmniSharp.exe.config
          if-no-files-found: warn

  verify_locked:
    runs-on: github-windows-latest-s
    name: Locked-mode restore from the committed Windows locks
    timeout-minutes: 30
    steps:
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2025.7.12

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: "false"
          fetch-depth: "0"

      - name: Get Repox Credentials from Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Locked-mode restore of the whole solution
        env:
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          dotnet --version
          dotnet restore OmniSharp.sln -p:RestoreLockedMode=true

  regen_linux:
    runs-on: ubuntu-22.04
    name: Regenerate Linux locks
    timeout-minutes: 30
    steps:
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2025.7.12

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: "false"
          fetch-depth: "0"

      - name: Get Repox Credentials from Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader username | ARTIFACTORY_USER;
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Regenerate packages.lock.linux.json
        env:
          ARTIFACTORY_USER: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_USER }}
          ARTIFACTORY_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          dotnet --version
          dotnet restore OmniSharp.sln --force-evaluate -p:RestoreLockedMode=false
          git status --short
          git diff --stat -- "*packages.lock.linux.json"

      - name: Upload regenerated Linux lock files
        uses: actions/upload-artifact@v4
        with:
          name: linux-locks
          path: '**/packages.lock.linux.json'
          if-no-files-found: error
